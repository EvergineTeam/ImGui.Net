name: Build native libs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-native-libs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: linux-x64
          - os: ubuntu-latest
            arch: arm64
            target: linux-arm64
          - os: windows-latest
            arch: x86_64
            target: win-x64
          # - os: windows-latest
          #   arch: x86
          #   target: win-x86
          - os: windows-latest
            arch: arm64
            target: win-arm64
          - os: macos-latest
            arch: x86_64
            target: osx-x64
          - os: macos-latest
            arch: arm64
            target: osx-arm64
          - os: ubuntu-latest
            arch: wasm
            target: browser-wasm
    steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ github.repository }}
        submodules: recursive

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config zip

    - name: Setup Ninja
      if: matrix.os == 'ubuntu-latest'
      uses: ashutoshvarma/setup-ninja@v1.1

    - name: Install Cross-Compilation Tools for ARM64
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    # Matches the Emscripten the .NET SDK links with, which is what makes the static
    # archive we ship usable. dotnet/emsdk pins 3.1.56 on release/9.0, release/10.0 and
    # .NET 11 through preview 5; 3.1.56 expects LLVM 19, while the 3.1.34 previously
    # used here expects LLVM 17 -- and the published cimgui.a did declare clang 17,
    # two generations behind the linker. Do not raise this past what the SDK pins.
    - name: Install Emscripten
      if: matrix.arch == 'wasm'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.56
        actions-cache-folder: 'emsdk-cache'

    - name: Build
      run: |
        cd NativeLibraries
        python3 build.py ${{matrix.target}}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cimgui-${{ matrix.target }}-artifacts
        path: NativeLibraries/build/OUT/*
        if-no-files-found: warn
