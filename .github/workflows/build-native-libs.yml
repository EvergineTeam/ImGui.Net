name: Build native libs

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      submodule-heads:
        description: >-
          JSON object of submodule path to the SHA to build, as produced by the
          toolbox's resolve step.

          Without it this job builds whatever the recorded pointers say -- and when the
          caller is about to bump them, those are the old ones, so the libraries belong
          to the revision being replaced. That combination passes every gate and is the
          exact mismatch they exist to catch.
        required: false
        type: string
        default: ''

jobs:
  build-native-libs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: linux-x64
          - os: ubuntu-latest
            arch: arm64
            target: linux-arm64
          - os: windows-latest
            arch: x86_64
            target: win-x64
          # - os: windows-latest
          #   arch: x86
          #   target: win-x86
          - os: windows-latest
            arch: arm64
            target: win-arm64
          - os: macos-latest
            arch: x86_64
            target: osx-x64
          - os: macos-latest
            arch: arm64
            target: osx-arm64
          - os: ubuntu-latest
            arch: wasm
            target: browser-wasm
    steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ github.repository }}
        submodules: recursive

    # Moved to the revisions the caller is about to commit, before anything is compiled.
    # Recursive, because each of the four carries its own submodule -- imgui, implot,
    # imnodes, ImGuizmo -- and those move with it. Skipping that is how a build compiled
    # new cimgui sources against an old imgui.
    - name: Check out the submodule revisions being built
      if: inputs.submodule-heads != ''
      shell: bash
      env:
        HEADS: ${{ inputs.submodule-heads }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, os, subprocess
        for path, sha in json.loads(os.environ["HEADS"]).items():
            print(f"{path} -> {sha}")
            subprocess.run(["git", "fetch", "--depth", "1", "origin", sha],
                           cwd=path, check=True)
            subprocess.run(["git", "checkout", "--detach", sha], cwd=path, check=True)
            subprocess.run(["git", "submodule", "update", "--init", "--recursive",
                            "--depth", "1"], cwd=path, check=True)
        PY
        git submodule status --recursive | head -20

    - name: Install dependencies on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config zip

    - name: Setup Ninja
      if: matrix.os == 'ubuntu-latest'
      uses: ashutoshvarma/setup-ninja@v1.1

    - name: Install Cross-Compilation Tools for ARM64
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    # Matches the Emscripten the .NET SDK links with, which is what makes the static
    # archive we ship usable. dotnet/emsdk pins 3.1.56 on release/9.0, release/10.0 and
    # .NET 11 through preview 5; 3.1.56 expects LLVM 19, while the 3.1.34 previously
    # used here expects LLVM 17 -- and the published cimgui.a did declare clang 17,
    # two generations behind the linker. Do not raise this past what the SDK pins.
    - name: Install Emscripten
      if: matrix.arch == 'wasm'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.56
        actions-cache-folder: 'emsdk-cache'

    - name: Build
      run: |
        cd NativeLibraries
        python3 build.py ${{matrix.target}}

    # Staged at the path it will occupy in the repository, so whoever consumes this
    # unpacks it over the working tree and is done. The CD used to carry seven
    # Copy-Item lines doing this by hand, one per platform, which is seven places to
    # forget when an eighth arrives.
    - name: Stage into the runtimes layout
      shell: bash
      run: |
        set -euo pipefail
        dest="staged/Generator/Evergine.Bindings.Imgui/runtimes"
        mkdir -p "$dest"
        cp -r NativeLibraries/build/OUT/* "$dest/"
        find staged -type f | sed 's/^/  /'

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cimgui-${{ matrix.target }}-artifacts
        path: staged/
        # Not `warn`. A platform that produced no library must stop the run: warning
        # uploads an empty artifact, and the CD would commit the absence and publish it.
        if-no-files-found: error
